name: Deploy desmake PREVIEW (ui-redesign → desmake-preview Worker)

# Previews the ui-redesign branch on a SEPARATE Cloudflare Worker (desmake-preview)
# so the redesign can be reviewed before it is ever cut over to main → production.
#
# • Never deploys to production ("desmake" Worker / desmake.com). Only deploy.yml does that.
# • Shares prod D1 + R2 + IMAGES bindings so the preview shows the real catalog.
# • SESSION_SECRET is a per-preview random value (wrangler secret put); without it the
#   Worker FATAL-crashes at init (session.ts H-13). Other secrets (STRIPE_*, AGNES_*) are
#   only used at request time for pay/generate, so public pages render fine without them.
#
# Required GitHub repo secrets (already present for deploy.yml):
#   CLOUDFLARE_API_TOKEN  -> Workers:Edit token (deploy + secret put)
#   CLOUDFLARE_ACCOUNT_ID -> Cloudflare account id

on:
  push:
    branches: [ui-redesign]
  workflow_dispatch:

concurrency:
  group: desmake-preview
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPEN_NEXT_DEPLOY: "true"

jobs:
  preview:
    name: Build & deploy preview (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate blog content (required before type-check)
        run: node scripts/gen-blog-content.mjs

      - name: Type check (fail fast before deploy)
        run: pnpm ts-check

      - name: OpenNext build
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy preview worker
        run: pnpm exec wrangler deploy --config wrangler.preview.jsonc 2>&1 | tee /tmp/deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Provision preview SESSION_SECRET (random, per-worker)
        run: |
          SECRET="desmake-preview-$(openssl rand -hex 32)"
          printf '%s' "$SECRET" | pnpm exec wrangler secret put SESSION_SECRET --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report preview URL
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "PREVIEW_URL=${URL}" >> "$GITHUB_ENV"
          echo "🚀 Preview is live at: ${URL:-<not detected — see /tmp/deploy.log>}"
